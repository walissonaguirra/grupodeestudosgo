{{ $next := .next }}
{{ $target := "" }}
{{ with $next }}{{ $target = .Date.Format "2006-01-02T15:04:05-07:00" }}{{ end }}

<div class="countdown d-flex justify-content-center gap-3 gap-md-4"
     data-countdown
     data-target="{{ $target }}"
     data-weekday="{{ site.Params.callWeekday }}"
     data-hour="{{ site.Params.callHour }}"
     data-reset-hour="{{ site.Params.resetHour }}">
  <div class="cd-unit"><span class="cd-num" data-days>--</span><span class="cd-label">dias</span></div>
  <div class="cd-unit"><span class="cd-num" data-hours>--</span><span class="cd-label">horas</span></div>
  <div class="cd-unit"><span class="cd-num" data-minutes>--</span><span class="cd-label">min</span></div>
  <div class="cd-unit"><span class="cd-num" data-seconds>--</span><span class="cd-label">seg</span></div>
</div>
