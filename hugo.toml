# Site do Grupo de Estudos Go — config Hugo
# baseURL "/" funciona no dev local (hugo server) e no deploy a Action passa a URL
# real do project page via --baseURL, então todos os links ganham o subpath certo.
baseURL = "/"
defaultContentLanguage = "pt-br"
title = "Grupo de Estudos Go"
timeZone = "America/Sao_Paulo"
enableEmoji = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "Grupo de estudos de Go do Cesar Gimenes — call todo sábado às 14h no Discord."
  # Links do grupo (edite à vontade)
  discord  = "https://discord.gg/pKXF9y95Pp"
  telegram = "https://t.me/grupoDeEstudosGolang"
  youtube  = "https://www.youtube.com/@grupodeestudosdegolang"
  github   = "https://github.com/crgimenes/grupo-estudos-golang"
  # Horário fixo da call (sábado = 6, 14h) — usado pelo timer
  callWeekday = 6
  callHour = 14
  # Conteúdo do card da home (edite à vontade)
  cardTitle = "Toda semana tem call de Go!"
  cardText = "A gente se encontra todo sábado às 14h no Discord pra estudar Go juntos: codar, trocar ideia e aprender no ritmo do grupo."

[markup.goldmark.renderer]
  unsafe = true

[outputs]
  home = ["HTML"]
